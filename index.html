<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{--ink:#121c1b;--panel:#1a2825;--paper:#e9e7d8;--muted:#9ba99e;--lime:#d8f36a;--orange:#ff8c56;--line:#35433d;--sky:#9bc8c5}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101a19;color:var(--paper);font-family:'Space Grotesk',sans-serif}body{padding:24px 18px 34px;background-image:radial-gradient(ellipse at 50% -20%,#2b4238 0%,transparent 55%),linear-gradient(140deg,#101a19,#15211e 55%,#111918)}button{font:inherit;color:inherit;cursor:pointer}.shell{max-width:1230px;margin:auto}.masthead{height:56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff1a;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.17em;font-size:14px}.brand-mark{width:29px;height:29px;background:var(--lime);color:var(--ink);display:grid;place-items:center;clip-path:polygon(0 0,100% 0,75% 100%,0 75%);font-size:16px}.mast-right{font:11px 'DM Mono',monospace;color:var(--muted);letter-spacing:.1em}.mast-right span{color:var(--lime)}.game-frame{border:1px solid #506159;background:#192521;box-shadow:0 25px 80px #0007;position:relative;overflow:hidden}.topbar{height:59px;background:#1a2825;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.mission-label{display:flex;gap:14px;align-items:center}.mission-label .tag{font:10px 'DM Mono';letter-spacing:.13em;color:var(--lime);border:1px solid #63724f;padding:5px 8px}.mission-title{font-size:14px;font-weight:600;letter-spacing:.04em}.stats{display:flex;gap:26px;font:10px 'DM Mono';letter-spacing:.08em;color:var(--muted)}.stat strong{font-weight:500;color:var(--paper);margin-left:7px}.stat .accent{color:var(--lime)}.viewport{height:min(61vw,580px);min-height:340px;position:relative;background:#789c99}.viewport canvas{display:block;width:100%;height:100%;image-rendering:auto}.bottom-bar{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#1a2825;border-top:1px solid var(--line)}.weapon-info{display:flex;align-items:center;gap:12px}.weapon-icon{width:32px;height:32px;display:grid;place-items:center;border:1px solid #60715d;color:var(--lime);font-size:17px}.weapon-name{font:11px 'DM Mono';letter-spacing:.1em}.weapon-hint{font:10px 'DM Mono';color:var(--muted);margin-top:4px}.controls-hint{font:10px 'DM Mono';color:#b4c0b4;letter-spacing:.04em}.key{border:1px solid #718076;border-bottom-width:2px;padding:3px 6px;margin:0 3px;color:var(--paper);border-radius:3px}.status-right{font:10px 'DM Mono';color:var(--lime);letter-spacing:.1em}.screen{position:absolute;inset:0;z-index:3;display:grid;place-items:center;background:linear-gradient(90deg,#121c1bd9,#14211bd9);backdrop-filter:blur(3px);padding:24px}.screen.hidden{display:none}.screen-card{width:min(780px,100%);border:1px solid #788776;background:#17231ff2;box-shadow:0 18px 70px #0008;padding:34px 38px;position:relative}.screen-card:before{content:'';position:absolute;top:-1px;left:-1px;width:58px;height:4px;background:var(--lime)}.eyebrow{font:10px 'DM Mono';letter-spacing:.18em;color:var(--lime);margin-bottom:13px}.screen h1{font-size:clamp(34px,6vw,63px);line-height:.96;letter-spacing:-.07em;margin:0;max-width:620px}.screen h1 i{font-style:normal;color:var(--lime)}.lede{color:#bdc8bb;max-width:525px;font-size:14px;line-height:1.6;margin:18px 0 24px}.button-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.primary,.secondary{padding:12px 18px;border:1px solid var(--lime);background:var(--lime);color:#17211b;font:11px 'DM Mono';letter-spacing:.1em;text-transform:uppercase;transition:.18s}.primary:hover{background:#eeffad;transform:translateY(-2px)}.secondary{background:transparent;color:var(--paper);border-color:#718076}.secondary:hover{border-color:var(--lime);color:var(--lime)}.fineprint{font:10px 'DM Mono';color:#89988d;margin-top:22px;letter-spacing:.04em}.menu-layout{display:grid;grid-template-columns:1fr 250px;gap:25px;align-items:center}.hangar-side{border-left:1px solid var(--line);padding-left:22px}.upgrade-row{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:12px 0;font-size:12px}.upgrade-row small{display:block;color:var(--muted);font:10px 'DM Mono';margin-top:4px}.buy{font:10px 'DM Mono';background:#25342d;color:var(--lime);border:1px solid #58684f;padding:8px 9px}.buy:disabled{opacity:.42;cursor:default}.weapon-select{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.weapon-option{background:#202f29;border:1px solid #45544a;padding:9px 11px;text-align:left;font:10px 'DM Mono';color:#bdc8bb}.weapon-option.selected{border-color:var(--lime);color:var(--lime)}.weapon-option:disabled{opacity:.4;cursor:not-allowed}.level-grid{display:flex;gap:7px;margin:18px 0}.level-dot{width:31px;height:31px;border:1px solid #536259;color:#aab8a9;display:grid;place-items:center;font:10px 'DM Mono'}.level-dot.done{background:var(--lime);color:var(--ink);border-color:var(--lime)}.level-dot.current{border-color:var(--orange);color:var(--orange)}.mobile-controls{display:none}.toast{position:absolute;z-index:2;left:50%;top:15px;transform:translateX(-50%);background:#17231fe8;border:1px solid #718076;padding:9px 14px;font:10px 'DM Mono';letter-spacing:.09em;color:var(--lime);pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .2s}.toast.show{opacity:1}.footer{display:flex;justify-content:space-between;color:#76857a;font:10px 'DM Mono';letter-spacing:.09em;padding:13px 2px}.footer b{font-weight:400;color:#a5b2a5}
@media(max-width:700px){body{padding:10px 8px 20px}.masthead{height:43px;margin-bottom:10px}.mast-right{font-size:9px}.topbar{height:48px;padding:0 12px}.stats{gap:10px;font-size:9px}.mission-title{font-size:12px}.mission-label{gap:8px}.mission-label .tag{font-size:8px;padding:4px 5px}.viewport{height:60vh;min-height:300px;max-height:480px}.bottom-bar{height:53px;padding:0 12px}.controls-hint{display:none}.status-right{font-size:8px}.screen{padding:12px}.screen-card{padding:24px 20px}.menu-layout{grid-template-columns:1fr;gap:18px}.hangar-side{border-left:0;border-top:1px solid var(--line);padding:14px 0 0}.lede{font-size:12px;margin:13px 0 17px}.mobile-controls{display:flex;position:absolute;bottom:10px;left:12px;right:12px;z-index:2;justify-content:space-between;pointer-events:none}.mobile-controls button{pointer-events:auto;background:#18251fc9;border:1px solid #aab69d;color:white;padding:13px 18px;font:10px 'DM Mono';letter-spacing:.08em;touch-action:none}.footer{font-size:8px}.weapon-hint{font-size:9px}}
</style>

<body>
<main class="shell">
<header class="masthead"><div class="brand"><div class="brand-mark">↗</div><span>SKYWARD</span><span style="color:#718076;font-weight:400">/ GROUNDSTRIKE</span></div><div class="mast-right">FLIGHT SYSTEM <span>● ONLINE</span></div></header>
<section class="game-frame" aria-label="Skyward airplane game">
<div class="topbar"><div class="mission-label"><span class="tag" id="missionTag">READY</span><span class="mission-title" id="missionName">Awaiting deployment</span></div><div class="stats"><div>LEVEL<strong id="levelStat">01</strong></div><div>TARGETS<strong class="accent" id="targetStat">—</strong></div><div>HULL<strong id="hullStat">♥♥♥</strong></div><div>CREDITS<strong id="creditStat">000</strong></div></div></div>
<div class="viewport"><canvas id="game" aria-label="Game play area"></canvas><div class="toast" id="toast"></div><div class="mobile-controls"><button id="mobileUp">▲ CLIMB</button><button id="mobileBomb">DROP BOMB</button><button id="mobileDown">▼ DIVE</button></div>
<div class="screen" id="screen"><div class="screen-card" id="screenCard"></div></div></div>
<div class="bottom-bar"><div class="weapon-info"><div class="weapon-icon">✳</div><div><div class="weapon-name" id="weaponName">STANDARD PAYLOAD</div><div class="weapon-hint" id="weaponHint">3 READY · FREEFALL</div></div></div><div class="controls-hint"><span class="key">↑</span><span class="key">↓</span> ALTITUDE <span class="key">SPACE</span> RELEASE <span class="key">P</span> PAUSE</div><div class="status-right" id="flightStatus">SYSTEMS STANDBY</div></div>
</section>
<footer class="footer"><span>AN ARCADE FLIGHT SIMULATION <b>·</b> FICTIONAL THEATER</span><span>BUILD 01.08 <b>·</b> SKYWARD AERONAUTICS</span></footer>
</main>
<script>
(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const $=s=>document.querySelector(s), screen=$('#screen'), card=$('#screenCard');
const weapons=[
 {id:'standard',name:'STANDARD',label:'Standard payload',cost:0,unlock:1,count:3,radius:43,color:'#ffd16a',desc:'Reliable single-target blast.'},
 {id:'cluster',name:'CLUSTER',label:'Cluster payload',cost:100,unlock:2,count:2,radius:78,color:'#ff9c62',desc:'Wide scatter burst. Level 2 clearance.'},
 {id:'heavy',name:'HEAVY',label:'Heavy payload',cost:220,unlock:3,count:2,radius:112,color:'#ff765c',desc:'A bigger arcade blast. Level 3 clearance.'},
 {id:'atomic',name:'ATOMIC',label:'Atomic payload',cost:480,unlock:5,count:1,radius:190,color:'#ed83b4',desc:'Fictional, screen-filling arcade pulse. Level 5 clearance.'}
];
const state={mode:'menu',level:1,credits:0,hull:3,maxHull:3,score:0,owned:['standard'],weapon:'standard',inventory:3,targets:[],bombs:[],particles:[],enemyShots:[],scroll:0,planeY:0,keys:{},last:0,frame:0,flash:0,shake:0,runHits:0,runDrops:0,unlockedLevel:1,levelKills:0,failureReason:null};
let W=960,H=540,dpr=1,toastTimer=0;
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(!state.planeY)state.planeY=H*.31}
new ResizeObserver(resize).observe(canvas);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),fmt=n=>String(n).padStart(3,'0');
function showToast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1250)}
function weapon(){return weapons.find(w=>w.id===state.weapon)||weapons[0]}
function showScreen(html){card.innerHTML=html;screen.classList.remove('hidden')}
function hideScreen(){screen.classList.add('hidden')}
function menu(){state.mode='menu';showScreen(`<div class="menu-layout"><div><div class="eyebrow">✦ FLIGHT WING 07 &nbsp; / &nbsp; OPERATION DUSTLINE</div><h1>THE SKY IS<br>YOUR <i>RUNWAY.</i></h1><p class="lede">A side-scrolling arcade sortie. Fly low, line up your drop, and clear every marked target. The terrain gets tougher with every level.</p><div class="button-row"><button class="primary" id="startBtn">START SORTIE &nbsp; ↗</button><button class="secondary" id="howBtn">FLIGHT MANUAL</button></div><div class="fineprint">↑ / ↓ ADJUST ALTITUDE &nbsp; · &nbsp; SPACE RELEASES PAYLOAD &nbsp; · &nbsp; P PAUSES</div></div><div class="hangar-side"><div class="eyebrow">MISSION BRIEF</div><div class="upgrade-row"><span>OBJECTIVE<small>Clear every marked ground target</small></span><b>✳</b></div><div class="upgrade-row"><span>THREATS<small>Hostile flak increases by level</small></span><b style="color:var(--orange)">!</b></div><div class="upgrade-row"><span>LOADOUT<small>Upgrade payloads between sorties</small></span><b>↗</b></div></div></div>`);
$('#startBtn').onclick=()=>beginLevel();$('#howBtn').onclick=manual;updateHud()}
function manual(){showScreen(`<div class="eyebrow">FIELD MANUAL / FLIGHT SCHOOL</div><h1>FLY. LINE UP.<br><i>LET GO.</i></h1><p class="lede">Your plane advances automatically. Use ↑ / ↓ or W / S to change altitude; position the dotted sight over a ground target and press SPACE (or tap DROP BOMB). Each level adds more targets, tougher defenses, and faster flak.</p><p class="lede">Targets take one or more hits. You have three hull points. Earn credits by clearing a level and spend them in the hangar on wider blast payloads. Unlock the fictional Atomic arcade payload at level 5.</p><div class="button-row"><button class="primary" id="backBtn">GOT IT — FLY</button></div><div class="fineprint">ALL WEAPONS AND TARGETS ARE FICTIONAL, ABSTRACT ARCADE ELEMENTS.</div>`);$('#backBtn').onclick=()=>beginLevel()}
function makeTargets(){const n=4+Math.min(state.level,6);state.targets=[];for(let i=0;i<n;i++){const gap=rand(W*.55,W*.9),x=W*.76+i*gap+state.scroll;const hp=1+Math.floor((state.level-1)/3)+(Math.random()<.3&&state.level>2?1:0);state.targets.push({x,y:H*.78,kind:i%4,hp,maxHp:hp,alive:true,size:rand(20,29),seed:Math.random()*10})}state.levelKills=0}
function beginLevel(){state.mode='playing';state.failureReason=null;state.keys.up=false;state.keys.down=false;state.scroll=0;state.bombs=[];state.particles=[];state.enemyShots=[];state.runHits=0;state.runDrops=0;state.flash=0;state.shake=0;state.planeY=H*.30;makeTargets();const required=state.targets.reduce((n,t)=>n+t.hp,0);state.inventory=required+(weapon().id==='standard'?2:1);hideScreen();$('#missionTag').textContent='ACTIVE SORTIE';$('#missionName').textContent=missionName();$('#flightStatus').textContent='FLIGHT PATH LOCKED';updateHud();showToast('LEVEL '+String(state.level).padStart(2,'0')+' — CLEAR ALL MARKED TARGETS')}
function missionName(){return ['Dustline','Dry River','Iron Mesa','Red Basin','Long Shadow','Nightfall','Final Approach'][Math.min(state.level-1,6)]||'Endless Frontier'}
function updateHud(){const remaining=state.targets.filter(t=>t.alive).length;$('#levelStat').textContent=String(state.level).padStart(2,'0');$('#targetStat').textContent=state.mode==='menu'?'—':String(remaining).padStart(2,'0');$('#hullStat').textContent='♥'.repeat(Math.max(0,state.hull))+'♡'.repeat(Math.max(0,state.maxHull-state.hull));$('#creditStat').textContent=fmt(state.credits);$('#weaponName').textContent=weapon().label.toUpperCase();$('#weaponHint').textContent=state.inventory+' READY · '+(weapon().id==='atomic'?'ARCADE PULSE':'FREEFALL');}
function showHangar(bonus=state.hangarBonus||0){state.hangarBonus=bonus;state.mode='hangar';const dots=Array.from({length:7},(_,i)=>`<span class="level-dot ${i<state.level?'done':i===state.level?'current':''}">${i+1}</span>`).join('');const opts=weapons.map(w=>{const owned=state.owned.includes(w.id),locked=state.level<w.unlock;return `<button class="weapon-option ${state.weapon===w.id?'selected':''}" data-weapon="${w.id}" ${!owned&&(locked||state.credits<w.cost)?'disabled':''}>${w.label}${owned?' ✓':locked?' · LV '+w.unlock:' · '+w.cost+' CR'}</button>`}).join('');const upgrades=[{id:'armor',name:'Reinforced hull',desc:`Hull ${state.maxHull}/4`,cost:170,done:state.maxHull>=4},{id:'repair',name:'Hull repair',desc:`Restore one point · ${state.hull}/${state.maxHull}`,cost:80,done:state.hull>=state.maxHull}];showScreen(`<div class="menu-layout"><div><div class="eyebrow">SORTIE COMPLETE &nbsp; / &nbsp; LEVEL ${String(state.level).padStart(2,'0')}</div><h1>${state.levelKills} TARGETS<br><i>NEUTRALIZED.</i></h1><p class="lede">Good flying. +${bonus} credits secured. Refit your loadout, then deploy to the next sector.</p><div class="eyebrow">SECTOR PROGRESS</div><div class="level-grid">${dots}</div><div class="eyebrow">SELECT PAYLOAD</div><div class="weapon-select">${opts}</div><div class="button-row"><button class="primary" id="nextBtn">${state.level===7?'NEXT FRONTIER':'DEPLOY LEVEL '+String(state.level+1).padStart(2,'0')} &nbsp; ↗</button></div></div><div class="hangar-side"><div class="eyebrow">HANGAR / ${fmt(state.credits)} CREDITS</div>${upgrades.map(u=>`<div class="upgrade-row"><span>${u.name}<small>${u.desc}</small></span><button class="buy" data-up="${u.id}" ${u.done||state.credits<u.cost?'disabled':''}>${u.done?'READY':u.cost+' CR'}</button></div>`).join('')}<div class="fineprint">NEXT PAYLOAD CLEARANCE: LEVEL 5</div></div></div>`);
card.querySelectorAll('[data-weapon]').forEach(b=>b.onclick=()=>{const w=weapons.find(a=>a.id===b.dataset.weapon);if(state.owned.includes(w.id)){state.weapon=w.id;updateHud();showHangar(0)}else buyUpgrade(w.id)});card.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>buyUpgrade(b.dataset.up));$('#nextBtn').onclick=()=>{state.level++;state.unlockedLevel=Math.max(state.unlockedLevel,state.level);if(state.hull===0)state.hull=1;beginLevel()};$('#missionTag').textContent='SECTOR CLEAR';$('#missionName').textContent='Return to hangar';$('#flightStatus').textContent='REFIT AVAILABLE';updateHud()}
function buyUpgrade(id){const w=weapons.find(a=>a.id===id);if(w&&state.credits>=w.cost&&state.level>=w.unlock&&!state.owned.includes(w.id)){state.credits-=w.cost;state.owned.push(w.id);state.weapon=w.id;showToast(w.label+' CLEARED')}else if(id==='armor'&&state.maxHull<4&&state.credits>=170){state.credits-=170;state.maxHull++;state.hull++;showToast('HULL REINFORCED')}else if(id==='repair'&&state.hull<state.maxHull&&state.credits>=80){state.credits-=80;state.hull++;showToast('HULL REPAIRED')}else{const w=weapons.find(a=>a.id===id);if(w&&state.credits>=w.cost&&state.level>=w.unlock){state.credits-=w.cost;state.owned.push(w.id);state.weapon=w.id;showToast(w.label+' CLEARED')}}showHangar(0);updateHud()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawCloud(x,y,s,a){ctx.globalAlpha=a;ctx.fillStyle='#f0eee0';ctx.beginPath();ctx.ellipse(x,y,s*1.3,s*.2,0,0,Math.PI*2);ctx.ellipse(x-s*.45,y+2,s*.6,s*.22,0,0,Math.PI*2);ctx.ellipse(x+s*.38,y-4,s*.72,s*.25,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
function drawPlane(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#23322e';ctx.strokeStyle='#d7e4c9';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-35,1);ctx.lineTo(-18,-5);ctx.lineTo(-12,-19);ctx.lineTo(-5,-19);ctx.lineTo(-7,-5);ctx.lineTo(17,-4);ctx.lineTo(27,-11);ctx.lineTo(31,-10);ctx.lineTo(27,-1);ctx.lineTo(35,2);ctx.lineTo(28,5);ctx.lineTo(24,12);ctx.lineTo(20,12);ctx.lineTo(18,5);ctx.lineTo(-8,5);ctx.lineTo(-13,15);ctx.lineTo(-18,15);ctx.lineTo(-17,5);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#d8f36a';ctx.beginPath();ctx.moveTo(-35,1);ctx.lineTo(-42,0);ctx.lineTo(-35,-2);ctx.fill();ctx.fillStyle='#8cc5bd';ctx.beginPath();ctx.moveTo(6,-3);ctx.lineTo(12,-3);ctx.lineTo(9,1);ctx.closePath();ctx.fill();ctx.restore()}
function drawTarget(t,x,ground){const y=ground-10+t.y-H*.78;ctx.save();ctx.translate(x,y);ctx.strokeStyle='#f3cb68';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(0,0,t.size+11,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#25332d';ctx.strokeStyle='#f0c967';ctx.lineWidth=1.5;
if(t.kind===0){rr(-t.size,-t.size*.48,t.size*2,t.size*.96,3);ctx.fillStyle='#566756';rr(-t.size*.58,-t.size*.68,t.size*1.15,t.size*.28,2);ctx.fillStyle='#d67d58';rr(-t.size*.25,-t.size*.2,t.size*.5,t.size*.45,2);ctx.fillStyle='#cad2aa';ctx.fillRect(-t.size*.58,t.size*.12,5,3);ctx.fillRect(t.size*.48,t.size*.12,5,3)}else if(t.kind===1){ctx.beginPath();ctx.arc(0,0,t.size*.68,Math.PI,0);ctx.lineTo(t.size*.7,t.size*.55);ctx.lineTo(-t.size*.7,t.size*.55);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(0,-t.size*.2);ctx.lineTo(t.size*.65,-t.size*1.35);ctx.stroke();ctx.fillStyle='#ff9165';ctx.beginPath();ctx.arc(t.size*.65,-t.size*1.35,2,0,7);ctx.fill()}else if(t.kind===2){rr(-t.size,-t.size*.6,t.size*2,t.size*1.2,3);ctx.fillStyle='#d5c897';ctx.fillRect(-t.size*.7,-t.size*.25,4,4);ctx.fillRect(t.size*.35,-t.size*.25,4,4);ctx.fillStyle='#34463a';ctx.fillRect(-t.size*.18,-t.size*.35,t.size*.36,t.size*.7)}else{ctx.fillStyle='#34473a';ctx.beginPath();ctx.arc(0,0,t.size*.74,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-t.size*1.7);ctx.moveTo(-t.size*.48,-t.size*.4);ctx.lineTo(t.size*.48,-t.size*.4);ctx.moveTo(-t.size*.28,-t.size*.7);ctx.lineTo(t.size*.28,-t.size*.7);ctx.stroke();ctx.beginPath();ctx.arc(0,-t.size*1.65,4,0,7);ctx.stroke()}
if(t.hp<t.maxHp){ctx.fillStyle='#14201d';ctx.fillRect(-t.size,t.size+6,t.size*2,3);ctx.fillStyle='#ff936a';ctx.fillRect(-t.size,t.size+6,t.size*2*t.hp/t.maxHp,3)}ctx.restore()}
function drawScene(dt){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#83b1af');sky.addColorStop(.52,'#bdd0ba');sky.addColorStop(.75,'#e0c995');sky.addColorStop(1,'#a67e55');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
const sunX=W*.77,sunY=H*.17;ctx.fillStyle='#ffe2a1';ctx.globalAlpha=.72;ctx.beginPath();ctx.arc(sunX,sunY,H*.047,0,7);ctx.fill();ctx.globalAlpha=1;for(let i=0;i<6;i++){const x=((i*197-state.scroll*.12)%(W+200)+W+200)%(W+200)-80;drawCloud(x,H*(.1+(i%3)*.07),22+i%4*7,.38)}
ctx.fillStyle='#72948b';ctx.beginPath();ctx.moveTo(0,H*.57);for(let x=0;x<=W+20;x+=20)ctx.lineTo(x,H*.49+Math.sin((x+state.scroll*.22)*.008)*H*.04+Math.sin((x+state.scroll*.11)*.021)*H*.018);ctx.lineTo(W,H*.8);ctx.lineTo(0,H*.8);ctx.fill();ctx.fillStyle='#91a487';ctx.beginPath();ctx.moveTo(0,H*.66);for(let x=0;x<=W+20;x+=20)ctx.lineTo(x,H*.59+Math.sin((x+state.scroll*.4)*.009)*H*.04+Math.sin((x+state.scroll*.3)*.016)*H*.017);ctx.lineTo(W,H*.83);ctx.lineTo(0,H*.83);ctx.fill();
const ground=H*.78;ctx.fillStyle='#b88d5d';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#d3ab6e';ctx.fillRect(0,ground,W,6);ctx.strokeStyle='#8a694b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,ground+3);ctx.lineTo(W,ground+3);ctx.stroke();
for(let i=0;i<42;i++){const x=((i*93-state.scroll*.85)%(W+100)+W+100)%(W+100)-30,y=ground+18+(i*37%(H-ground-24));ctx.fillStyle=i%3?'#d3a66d':'#886c4c';ctx.globalAlpha=.5;ctx.fillRect(x,y,4+i%5,1.5);ctx.globalAlpha=1}
// road and scattered scrub
const roadY=ground+H*.12;ctx.fillStyle='#907454';ctx.fillRect(0,roadY,W,H*.034);ctx.fillStyle='#c7a77b';for(let x=-((state.scroll*.7)%70);x<W;x+=70)ctx.fillRect(x,roadY+H*.014,34,2);
for(let i=0;i<18;i++){const x=((i*121-state.scroll*.7)%(W+70)+W+70)%(W+70)-25;const y=ground+22+(i*29%(H-ground-32));ctx.strokeStyle='#6d805b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y+5);ctx.lineTo(x,y-5);ctx.moveTo(x,y);ctx.lineTo(x-4,y-4);ctx.moveTo(x,y-1);ctx.lineTo(x+5,y-6);ctx.stroke()}
for(const t of state.targets)if(t.alive){const sx=t.x-state.scroll;if(sx>-90&&sx<W+90)drawTarget(t,sx,ground)}
// aim reticle calibrated to the bomb's forward drift
const planeX=W*.22,fallFrames=Math.sqrt(2*Math.max(0,ground-(state.planeY+12))/.24),aimX=planeX+1.05*fallFrames;ctx.save();ctx.strokeStyle='#e8f2d1';ctx.globalAlpha=.74;ctx.setLineDash([3,5]);ctx.beginPath();ctx.moveTo(aimX,ground-20);ctx.lineTo(aimX,ground+10);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(aimX,ground-12,9,0,7);ctx.moveTo(aimX-14,ground-12);ctx.lineTo(aimX-7,ground-12);ctx.moveTo(aimX+7,ground-12);ctx.lineTo(aimX+14,ground-12);ctx.stroke();ctx.restore();
for(const b of state.bombs){const x=b.x-state.scroll;ctx.save();ctx.translate(x,b.y);ctx.rotate(.2);ctx.fillStyle=weapon().color;ctx.beginPath();ctx.moveTo(-4,-7);ctx.lineTo(4,-7);ctx.lineTo(5,5);ctx.lineTo(0,10);ctx.lineTo(-5,5);ctx.closePath();ctx.fill();ctx.fillStyle='#f8efd6';ctx.fillRect(-1,-11,2,4);ctx.restore();ctx.strokeStyle='#fff0c1';ctx.globalAlpha=.45;ctx.beginPath();ctx.moveTo(x,b.y-8);ctx.lineTo(x-4,b.y-25);ctx.stroke();ctx.globalAlpha=1}
for(const p of state.particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x-state.scroll,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;
for(const s of state.enemyShots){ctx.fillStyle='#ff7558';ctx.shadowColor='#ff6c48';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(s.x-state.scroll,s.y,3,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffb27b';ctx.globalAlpha=.45;ctx.beginPath();ctx.moveTo(s.x-state.scroll,s.y);ctx.lineTo(s.x-state.scroll+8,s.y-5);ctx.stroke();ctx.globalAlpha=1}
drawPlane(planeX,state.planeY);if(state.flash>0){ctx.fillStyle=`rgba(255,244,218,${state.flash*.34})`;ctx.fillRect(0,0,W,H)}
// small flight instruments
ctx.fillStyle='#17231fc7';rr(14,14,144,31,3);ctx.fillStyle='#d8f36a';ctx.font='10px DM Mono,monospace';ctx.fillText('ALT '+Math.round((ground-state.planeY)*.45)+' FT',25,34);ctx.fillStyle='#f0ead4';ctx.fillText('SPD  '+Math.round(230+state.level*12)+' KT',87,34);
}
function release(){if(state.mode!=='playing')return;if(state.inventory<=0){showToast('PAYLOAD EMPTY — CLEARANCE REFIT AFTER LEVEL');return}const w=weapon(),x=W*.22+state.scroll;state.bombs.push({x,y:state.planeY+12,vy:0,vx:1.05,age:0,radius:w.radius,color:w.color,id:w.id});state.inventory--;state.runDrops++;updateHud();$('#flightStatus').textContent='PAYLOAD RELEASED';setTimeout(()=>{if(state.mode==='playing')$('#flightStatus').textContent='FLIGHT PATH LOCKED'},500)}
function impact(b){const sx=b.x-state.scroll,ground=H*.78;let hits=0;for(const t of state.targets){if(!t.alive)continue;const d=Math.abs(t.x-b.x);if(d<=b.radius+t.size*.55){const damage=b.id==='atomic'?t.hp:1;t.hp-=damage;hits++;if(t.hp<=0){t.alive=false;state.levelKills++;state.score+=100;burst(t.x,ground-7,b.color,26)}else burst(t.x,ground-7,'#ffb96a',9)}}if(hits){state.runHits+=hits;showToast(hits>1?'MULTI TARGET HIT ×'+hits:'TARGET HIT')}else showToast('IMPACT — NO TARGET IN BLAST');burst(b.x,ground-6,b.color,b.id==='atomic'?54:24);state.shake=b.id==='atomic'?11:4;state.flash=b.id==='atomic'?.8:.25;if(state.targets.every(t=>!t.alive)){const bonus=90+state.level*32+state.levelKills*12;state.credits+=bonus;state.mode='hangar';setTimeout(()=>showHangar(bonus),900)}updateHud()}
function burst(x,y,color,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rand(.5,4.2);state.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-rand(0,2),life:rand(22,55),max:55,r:rand(1.3,4),color:Math.random()<.25?'#fff0c1':color})}}
function enemyFire(){const eligible=state.targets.filter(t=>t.alive&&t.x-state.scroll>W*.4&&t.x-state.scroll<W+100);if(!eligible.length)return;const t=eligible[Math.floor(Math.random()*eligible.length)],sx=t.x,sy=H*.78-23;const dx=W*.22+state.scroll-sx,dy=state.planeY-sy,len=Math.hypot(dx,dy)||1;const speed=2.3+state.level*.15;state.enemyShots.push({x:sx,y:sy,vx:dx/len*speed,vy:dy/len*speed})}
function damage(){if(state.invuln>0)return;state.hull--;state.invuln=105;state.flash=.8;state.shake=8;burst(W*.22+state.scroll,state.planeY,'#ff7558',20);showToast('FLAK HIT — HULL '+state.hull+' LEFT');updateHud();if(state.hull<=0){state.mode='failed';setTimeout(gameOver,600)}}
function gameOver(){if(state.mode!=='failed')return;$('#missionTag').textContent='SORTIE FAILED';$('#missionName').textContent='Return to briefing';$('#flightStatus').textContent='REDEPLOY AVAILABLE';const missed=state.failureReason==='TARGET MISSED';showScreen(`<div class="eyebrow">FLIGHT SYSTEM / DAMAGE REPORT</div><h1>MISSION<br><i>ABORTED.</i></h1><p class="lede">${missed?'A marked target slipped behind your aircraft in sector':'Your aircraft took too much flak in sector'} ${String(state.level).padStart(2,'0')}. All previously cleared sectors remain complete. Return to the hangar and try a new approach.</p><div class="button-row"><button class="primary" id="retryBtn">REDEPLOY &nbsp; ↗</button><button class="secondary" id="menuBtn">MAIN MENU</button></div><div class="fineprint">TIP: ${missed?'Line up each target before it passes behind you.':'CHANGE ALTITUDE TO DODGE INCOMING FLAK.'}</div>`);$('#retryBtn').onclick=()=>{state.hull=state.maxHull;beginLevel()};$('#menuBtn').onclick=()=>menu()}
function pause(){if(state.mode==='playing'){state.keys.up=false;state.keys.down=false;state.mode='paused';showScreen(`<div class="eyebrow">FLIGHT PAUSED</div><h1>TAKE A<br><i>BREATHER.</i></h1><p class="lede">Your sortie is on hold. Resume when ready.</p><button class="primary" id="resumeBtn">RESUME FLIGHT &nbsp; ↗</button>`);$('#resumeBtn').onclick=()=>{hideScreen();state.mode='playing'}}else if(state.mode==='paused'){hideScreen();state.mode='playing'}}
function tick(dt){if(state.mode==='playing'){state.frame+=dt;state.scroll+=(2.3+state.level*.14)*dt;const speed=2.45+state.level*.1;state.planeY+=((state.keys.up?-1:0)+(state.keys.down?1:0))*2.7*dt;state.planeY=clamp(state.planeY,H*.19,H*.50);if(state.frame%(Math.max(58,170-state.level*13))<dt)enemyFire();if(state.frame%130<dt&&Math.random()<.6)enemyFire();
for(let i=state.bombs.length-1;i>=0;i--){const b=state.bombs[i];b.age+=dt;b.x+=b.vx*dt;b.vy+=.24*dt;b.y+=b.vy*dt;if(b.y>=H*.78){impact(b);state.bombs.splice(i,1)}}
for(let i=state.enemyShots.length-1;i>=0;i--){const s=state.enemyShots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;if(Math.hypot(s.x-(W*.22+state.scroll),s.y-state.planeY)<19){state.enemyShots.splice(i,1);damage()}else if(s.x-state.scroll<-30||s.y<0||s.y>H)state.enemyShots.splice(i,1)}
if(state.invuln>0)state.invuln-=dt;for(let i=state.particles.length-1;i>=0;i--){const p=state.particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.035*dt;p.life-=dt;if(p.life<=0)state.particles.splice(i,1)}if(state.flash>0)state.flash=Math.max(0,state.flash-.035*dt);if(state.shake>0)state.shake=Math.max(0,state.shake-.4*dt);
if(state.targets.some(t=>t.alive&&t.x-state.scroll<-70)){const t=state.targets.find(t=>t.alive&&t.x-state.scroll<-70);if(t){state.failureReason='TARGET MISSED';state.mode='failed';state.keys.up=false;state.keys.down=false;showToast('TARGET MISSED — SORTIE FAILED');setTimeout(gameOver,600);updateHud()}}
}drawScene(dt);if(state.shake){ctx.save();ctx.translate(rand(-state.shake,state.shake),rand(-state.shake,state.shake));ctx.restore()}requestAnimationFrame(loop)}
function loop(now){const dt=Math.min(2.2,(now-state.last)/16.67||1);state.last=now;tick(dt)}requestAnimationFrame(loop);
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown',' ','w','W','s','S'].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key==='ArrowUp'||e.key==='w'||e.key==='W')state.keys.up=true;if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')state.keys.down=true;if(e.code==='Space'){if(state.mode==='paused')pause();else release()}if(e.key==='p'||e.key==='P')pause();if(e.key==='Escape'&&state.mode==='playing')pause()});window.addEventListener('keyup',e=>{if(e.key==='ArrowUp'||e.key==='w'||e.key==='W')state.keys.up=false;if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')state.keys.down=false});window.addEventListener('blur',()=>{state.keys.up=false;state.keys.down=false});
function bindHold(id,key){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();state.keys[key]=true;el.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>state.keys[key]=false))}bindHold('#mobileUp','up');bindHold('#mobileDown','down');$('#mobileBomb').addEventListener('pointerdown',e=>{e.preventDefault();release()});
menu();
})();
</script>
</body>
